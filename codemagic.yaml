# ---------------------------------------------------------------------------
# Tiny Zoom - ALTERNATIVE cloud build on Codemagic (codemagic.io).
# Use this instead of the GitHub Actions workflow if you prefer a point-and-click
# CI with a free monthly allowance of macOS build minutes.
#
# One-time setup in the Codemagic web UI (see IOS_SETUP.md, "Option B"):
#   1. Team settings > Team integrations > Developer Portal > Manage keys >
#      Add key: name it  TinyZoomASC  and upload the same .p8 API key
#      (Issuer ID + Key ID).
#   2. Team settings > codemagic.yaml settings > Code signing identities:
#      - iOS certificates > Generate certificate > type "Apple Distribution"
#        (download it + note the password, then upload it on the same tab).
#      - iOS provisioning profiles > Fetch profiles > pick the App Store
#        profile for com.adikleineiny.tinyzoom (create it first on
#        developer.apple.com > Profiles if the list is empty).
#   3. Add this repository as an app in Codemagic and start "ios-testflight".
# ---------------------------------------------------------------------------
workflows:
  ios-testflight:
    name: Tiny Zoom iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: TinyZoomASC        # name of the API key from step 1

    environment:
      ios_signing:                          # fetches the cert + profile from step 2
        distribution_type: app_store
        bundle_identifier: com.adikleineiny.tinyzoom
      node: 22                              # Capacitor 8 needs Node 22+
      xcode: latest                         # App Store requires Xcode 26+
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    triggering:                             # remove this block to build only manually
      events: [tag]
      tag_patterns:
        - pattern: "ios-v*"

    scripts:
      - name: Install npm packages
        script: npm ci

      - name: Copy the web game into the iOS project
        script: npx cap sync ios

      - name: Apply the signing profile to the Xcode project
        script: xcode-project use-profiles

      - name: Build the signed .ipa
        # BUILD_NUMBER is Codemagic's build counter - it goes up every build,
        # which is what App Store Connect wants.
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration                   # uses the API key from step 1
        # Internal testers (you) get every uploaded build in TestFlight automatically.
        # Set to true only when you want to send builds to Apple's beta review
        # for EXTERNAL testers (needs "Test Information" filled in App Store Connect).
        submit_to_testflight: false
