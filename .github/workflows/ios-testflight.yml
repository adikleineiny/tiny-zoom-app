# ---------------------------------------------------------------------------
# Tiny Zoom - build the iOS app in the cloud (GitHub's macOS runner) and
# upload it to TestFlight. No Mac needed on your side.
#
# How it works (plain xcodebuild, no fastlane, no CocoaPods):
#   1. Install the npm packages and copy the web game (www/) into the Xcode project.
#   2. "Archive" the app with Xcode. Xcode signs it automatically, using your
#      App Store Connect API key to create/download certificates and profiles
#      ("cloud signing" - Apple keeps the distribution certificate for you).
#   3. Export the archive with destination=upload, which sends it straight to
#      App Store Connect. A few minutes later it shows up in TestFlight.
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   APP_STORE_CONNECT_API_KEY_ID   - Key ID of the API key, e.g. 2X9R4HXF34
#   APP_STORE_CONNECT_ISSUER_ID    - Issuer ID shown above the keys list (a UUID)
#   APP_STORE_CONNECT_API_KEY_P8   - full text of the AuthKey_XXXX.p8 file,
#                                    including the BEGIN/END PRIVATE KEY lines
#   APPLE_TEAM_ID                  - your 10-character Team ID, e.g. A1B2C3D4E5
# The API key must have the "Admin" role (needed for cloud-managed signing).
#
# Run it: Actions tab > "iOS - TestFlight" > Run workflow.
# ---------------------------------------------------------------------------
name: iOS - TestFlight

on:
  workflow_dispatch:          # manual "Run workflow" button
  push:
    tags: ["ios-v*"]          # or push a tag like ios-v1.0.1 to build automatically

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-26         # macOS + Xcode 26 (App Store requires the iOS 26 SDK or newer)
    timeout-minutes: 45

    env:
      BUNDLE_ID: com.adikleineiny.tinyzoom
      PROJECT: ios/App/App.xcodeproj
      SCHEME: App
      # Build number must go up for every upload. The run number does that for us.
      # (Bump the offset if you ever upload builds from elsewhere.)
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (Capacitor 8 needs Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Copy the web game into the iOS project (cap sync)
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Save the App Store Connect API key to a file
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s\n' "$API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (build + sign) the app
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TinyZoom.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*sign|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/TinyZoom.xcarchive" || { echo "Archive failed - see archive.log artifact"; tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export and upload to App Store Connect / TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Export options: App Store distribution, automatic (cloud) signing, upload directly.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TinyZoom.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It appears in App Store Connect > TestFlight after Apple finishes processing (usually 5-30 min)."

      - name: Keep the build log if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export/*.log
          if-no-files-found: ignore

      - name: Remove the API key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
